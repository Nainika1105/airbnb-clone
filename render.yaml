services:
  - type: web
    name: airbnb-clone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # The repo checkout is read-only at runtime; keep SQLite on the writable /tmp disk.
      - key: DATABASE_PATH
        value: "/tmp/airbnb.db"
